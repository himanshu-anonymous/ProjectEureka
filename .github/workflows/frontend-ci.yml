name: Project EUREKA Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - 'frontend*'
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'frontend/MCC/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
      - 'frontend*'
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'frontend/MCC/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test-and-build:
    name: Frontend Test & Build Suite (MCC)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/MCC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/MCC/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Frontend Unit Test Suite
        run: npm test
        env:
          NODE_OPTIONS: '--experimental-strip-types'

      - name: Build Next.js Production Bundle
        run: npm run build
